<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notch Inbox Link</title>
<style>
  body { font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 14px 16px; width: 290px; color: #1d1d1f; }
  h1 { font-size: 14px; margin: 0 0 6px; }
  #state { font-weight: 600; }
  #state.ok { color: #1a7f37; }
  #state.bad { color: #b42318; }
  ul { margin: 8px 0; padding-left: 18px; }
  .muted { color: #6e6e73; font-size: 12px; margin-top: 6px; }
  #whole { font-size: 12px; margin-top: 6px; }
  button { margin-top: 10px; font: inherit; padding: 4px 12px; }
</style>
</head>
<body>
<h1>Notch Inbox Link</h1>
<div id="state">Checking…</div>
<ul id="accounts"></ul>
<div class="muted" id="when"></div>
<div id="whole"></div>
<div class="muted">Reads the unread mail of each Gmail account signed in here (the Primary tab, plus Google Classroom and other mail from Google), opens it in full and passes it only to Notch Inbox on this Mac.</div>
<button id="sync" type="button">Sync now</button>
<script src="popup.js"></script>
</body>
</html>
